services:
  - type: web
    name: asamai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: VECTOR_TOP_K
        value: "50"
      - key: RERANK_THRESHOLD
        value: "0.75"
      - key: MAX_NOTIFIED_AGENTS
        value: "5"
